name: Build & Validate

# 说明：Cloudflare Pages 通过 Git 集成自动构建部署（Root=web, Build=npm run build, Output=out）。
# 本工作流的作用是在每次 push / PR 时完整跑一遍「数据校验 + 前端构建」，
# 防止坏数据或坏代码进入 main 后把线上构建打挂。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate game YAML files
        run: python scripts/validate-games.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install root dependencies (js-yaml for sync-data)
        run: npm install --no-audit --no-fund

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build static site (sync YAML -> JSON + next build)
        working-directory: web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: web/out
          retention-days: 7
