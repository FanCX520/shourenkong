  \ sorts of obstacles.\n\nBoosty :  https://boosty.to/onek_dev/donate \n\nDonation\
  \ Alert : https://dalink.to/onek_dev  \n https://www.donationalerts.com/r/onek_dev\
  \  (I will answer in the Telegram channel)\n\nGratitude\n\n \U0001D5B5\U0001D5C2\
  \U0001D5CB\U0001D5CEs, TeffyDerg  - sprites\n\n Erid/Zahar - mobels\n\n Drimer544\
  \ - application icon\n\n Orexx - beautiful art\n\n Daniello - Title of the game\n\
  \n Kastle - Promotion of the game\n\n PIROG, HUMST , Phant -  Music\n\n And others\
