description_full: "Our discord server has reopened. Consider joining the link below: \n\
  \n https://discord.gg/rosesintheflames \n\nAt first, in this demo you become acquainted\
  \ in a new world with living dragons.\n\nIn the main game, you will become drawn\
  \ into a growing conspiracy that stretches far beyond the capital of Drachenshire.\
  \ Every choice you pull brings you deeper into conflict where trust can easily be\
  \ broken and survival comes first at all costs! \n\nOur team has been faced with\
  \ this question many times. Is the full game going to be released? Answer: Yes.\
  \ The main game is still being produced and will be released at a future date as\
  \ a whole game. \n\nPremise: You are the main character who had the mysterious fate\
  \ of walking through a magical pond and only to discover after resurfacing, you\
  \ find out it's a world inhabited by Dragons.\n\nWe're currently producing a new\
  \ demo and planning to update our audiences. \n\nThank you for your patience.\n\n\
  \ Revised July 29th, 2026."
