description_full: "Kalops has always been fascinated by the flora and fauna of her\
  \ world, Okali. Though she used to get all the knowledge she could want from books,\
  \ her village is too isolated to get enough new material to keep her satisfied.\
  \ Pushed by her desire to learn, she departs on a grand journey around the world,\
  \ and finds more than she expected...\n\n Wandering Okali is a visual novel with\
  \ strong focus on fantasy creatures and their biology, which lets you follow Kalops,\
  \ her best friend Saspi and strange lady Gloria on a world trip around Okali, discovering\
  \ and learning about unique animals, magical plants, and even mysterious entities.\n\
  \nEach chapter is expected to be around 10k words or more. \n\nThis VN is a kinetic\
  \ novel. This means there is only one main narrative, and any choices you are presented\
  \ with will only have very short-term consequences.\n\n What you can expect: \n\n\
  \ Lots of art: Feast your eyes on the many painted CGs and backgrounds, the field\
  \ notes in the style of old scientific illustrations, and the many silly doodles\
  \ that complete the visuals of the story. Perhaps even an animation or two, once\
  \ in a while~\n\n Immersive worldbuilding: With the story's focus on the natural\
  \ world, you will learn about the tiny bugs and the grasses unique to this world,\
  \ as well as the giant magical beasts and the ethereal landscapes. \n\n Girls, girls,\
  \ girls: Most, if not all the characters will be girls (or girl-adjacent). And lesbians,\
  \ most likely. \n\n A bright and whimsical atmosphere: You can expect to see lots\
  \ of beautiful, vibrant colors and intricate details!\n\n Chapter 5 is out! \n\n\
  Get updates, previews, and extra lore and concept art in the Tumblr blog!\n \U0001FAB2\
  \ https://wanderingokali.tumblr.com/   \U0001FAB2"
