description_full: "(Bara, BxB, BL, Slice of Life)\n\nBara Boarders is a short and\
  \ cute VN that takes place on an idyllic beach in Hawaii. You are a newbie surfer,\
  \ whose been out on the waves enough times, but is aching to finally catch a wave\
  \ and stay up on your board for the first time. You’re determined that today will\
  \ be the day!\n\nThing is, you’re going to run into distractions, other handsome\
  \ surfers - will they hinder or can they help you on your quest in paradise today?\n\
  \nBara Boarders features a new Soulsoft game mechanic. At any point, you can click\
  \ the “Phone Number” button on the HUD, essentially asking a guy for his phone number.\
  \ If he’s feeling you, he’ll exchange numbers with you, but getting it is all about\
  \ understanding the flow of conversation, social/emotional intelligence, timing\
  \ and let’s face it…luck! (Like in real life)\n\nProud to be a submission as part\
  \ of the first ever BARA JAM (2018)!\n https://itch.io/jam/barajam-2018 \n\nFEATURES\n\
  \n100% free!\n\n3 Buff Love Interests\n\n3 Good, 6 Not-So-Good Endings \n\nWonderful\
  \ tropical and relaxing hawaiian tunes, including some classics\n\nNew \"Phone Number\"\
  \ Game Mechanic, control when you initiate love\n\nCute classic 2D cartoon aesthetic\n\
  \n Soulsoft also has other great games at  https://soulsoftea.itch.io/ \n\n If you\
  \ find bugs or typos please contact me at soulsoftea@gmail.com"
