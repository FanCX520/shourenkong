description_full: "This is a personal project I will be working in my free time, hope\
  \ you have fun with it.  \n\nAdded a new Character: \n\nDereck (The Farm Bunny)\n\
  \n NOTE #1 : Web version it's only a demo, since the engine isn't that stable for\
  \ this particular project.  Download the game to have the full experience!\r\n\n\
  \ Controls for Windows/Web: \n\nMovement - WASD \r\n\nWeak punch - U \r\n\nStrong\
  \ punch - I\r\n\nDodge - O \r\n\nWeak kick/ Weak Special - J \r\n\nStrong kick /\
  \ Strong Special - K \r\n\nEX Special- L \r\n\nTaunt- 1 \r\n\nReturn to title screen\
  \ / Exit the game from title screen - Escape\n\n Support me \r\n\n Additional not\
  \ es: \n\nCharacters and stages are made by me Morishasu \n\nKFM character and stage\
  \ made by Elecbyte:  http://www.elecbyte.com/mugendocs-11b1/mugen.html \r\n\nThis\
  \ is an in-development Mugen interpreter for Web, so all glitches, false behaviours\
  \ and other unusual things happening with the characters/stages are not the original\
  \ creators' fault, but rather reflect this developmental status\r\n\nSource code\
  \ is on  github :  http://github.com/CaptainDreamcast/DolmexicaInfinite/   \n\n\
  \ Please Support Me On : \r\n\n Patreon | Ko-Fi \n\n Thanks to  Dolmexica Infinite\
  \ developers for creating the web support for MUGEN ❤️ \n\n Thanks for playing! ❤️\U0001F43B\
  ‍❤️"
