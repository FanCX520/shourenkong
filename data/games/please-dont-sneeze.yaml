description_full: "Please Don't Sneeze!\n\nPlay a cute, short, gay visual novel about\
  \ trying to avoid sneezing to not scare away your blind date.\n\nHay fever sufferer\
  \ Jamie forgets to take his medicine the morning before his date. Can he steer the\
  \ date away from any risky pollen to finally get a date that ends in success?\n\n\
  Make smart choices on the date to make sure it lasts as long as possible for your\
  \ date (Alexander) to get to know you.\n\nMade for  #BlossomVNJam \n\nFeatures\n\
  \n4 endings\r\n\n~2k wordcount, around 10 minutes of gameplay\r\n\nStreaming/recording\
  \ OK!\n\nFeedback is appreciated. Thanks for playing.\n\nmusic- Sonu"
