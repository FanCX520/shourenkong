description_full: "From the fans that brought you Is Lupin Still Flirting , comes\
  \ another tale of master thief Lupin the Third, as he sets his sights on cool gunman\
  \ Jigen Daisuke. Keep social stats balanced as you help Lupin win over Jigen’s trust,\
  \ without getting Jigen fed up with Lupin's constant BS. \n\nCan you complete the\
  \ legendary partnership, or will Lupin's selfishness sever their bond once and for\
  \ all? We welcome both fans of the franchise and newcomers alike to enjoy three\
  \ rousing rounds of wisecracking flirting.\n\nWe are pleased to present:\n\nOver\
  \ 22k words,\n\nMultiple paths through each of our three chapters,\n\nOne True End,\
  \ with several alternates along the way,\n\nCasual conversation mechanics, with\
  \ stats like \"Trust\" and \"Patience,\"\n\nA soundtrack that includes brand-new\
  \ arrangements of classic songs from the history of Lupin the Third,\n\nAn art style\
  \ painted in traditional watercolor and gouache,\n\nAnd more!"
