description_full: "Cryptid Crush is a TTRPG inspired  Monster Visual Novel with eldritch\
  \ elements! \n\nCheck out our  website !\n\nHaunted. Cursed. Single.\n\nYou arrive\
  \ in the seaside town of Longhope surrounded by monsters of urban myth- including\
  \ your Mothman best friend, Atlas, and Jamie, the wingless Jersey Devil. Test your\
  \ luck in love and life as you form bonds with the denizens (living, dead, and demonic)\
  \ of Longhope.\n\nCryptid Crush will feature at  least  FIVE monster singles, and\
  \ will receive updates with new content every few months!\n\n Major thanks to our\
  \ playtesters, friends and folk heroes like you! \n\nhttps://www.patreon.com/platform/iframe?widget=become-patron-button&redirectURI=https%3A%2F%2Fitch.io%2Fgame%2Fedit%2F815590&creatorID=19966246"
