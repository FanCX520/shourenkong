  \ Full SFX Attribution List \n\nVCR OSD Mono Font by Riciery Leal \n\nDudu Calligraphy Font\
  \ by Adderou \n\nTerminal F4 Font by Daymariu \n\nContent Warnings:\n\n Foul Language,\
