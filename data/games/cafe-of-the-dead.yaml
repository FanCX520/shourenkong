description_full: "UPDATE 1.1 OUT NOW!!!!!!! \n\n p.s. You can lower or mute character\
  \ text beeps with the \"voice\" volume slider in preferences and use SHIFT+A to\
  \ disable the custom font! \n\nA puzzle/ point and click/ zombie survival horror\
  \ visual novel!!!!!\n\nThis visual novel is about going to a cafe with your friends until the friggin ZOMBIE APOCALYPSE HAPPENS!!!!\n\
  \nTraverse the skyscraper to call the helicopter!\n\n Will you be able to survive? How many of\
  \ your friends will make it out with you? And what will be left of them?\n\n There\
  \ are over 28,000 words and every character can live or die depending on your choices!!\
  \ Navigate around rooms with it's point and click feature!! Keep a check on your sanity\
  \ and friends or else something may happen...\n\n YOU WILL EXPERIENCE THE FOLLOWING!!!!!!!\
  \ \n\n ZOMBIES\n\nEvery character being able to live or die!\n\nEvil corporations!@\n\
  \nfurries!!\n\ndeath!\n\nlife!\n\nfully exporable rooms!!\n\nromance\r\n\nbranching\
  \ dialogue trees!!!\n\ncharacter will remember that....\r\n\nquestionable business ethics!\n\
  \ntoilet!!!!!!!!!!!!!!\r\n\nLOOOORRRRREEEEE!\r\n\ngay people!!11111\r\n\nscientific experiments gone horribly wrong !  1!!\r\
  \n\nfurries 1!!!!\r\n\nmental illnesses ;(\r\n\nmultiple endings!!!\n\na really mean\
  \ villain...\n\nand point and click puzzles!!!!!!\r\n\nCREDITS:\n\nRen'Py Engine\
