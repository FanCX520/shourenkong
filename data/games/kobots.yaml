description_full: "Kobots\n\nA Lemmings  inspired game where you pillage treasure\
  \ using cutting-edge Kobot machines.\n\nKobots was made during  Gamedev.js Jam 2026\
  \ \n\nHow to Play\n\n Select tool : Click on a tool in the bottom panel to equip\
  \ it.\n\n Place tool : Hold and drag from a valid empty tile. \n Rope : Can be placed\
  \ on ceilings or on thin platforms. Hold and drag downwards to extend.\n\n Zipline\
  \ : Can be placed on floors or walls. Hold and drag sideways to extend. The other\
  \ end must also attach to a floor or wall.\n\n Fan : Can be placed on any floor.\
  \ Does not extend.\n\n Toggle tool : Click on a placed tool to turn it on or off.\n\
  \nTeam\n\n Golen (code, music)\n\n Naika (art)\n\n Mato  (sound)\n\nAbout\n\nMade\
  \ using  Phaser 3.90 \n\nFull song:  beepbox.co  (jam version  here )\n\nJam version: \
  \ https://kobots.web.app/  \n\nSource code:  https://github.com/Chocobois/Machine"
