description_full: 'Explore a new adventure in Neo Gift of Gains.


  Embiggen a number of different men to complete the protagonist Eugene''s mysterious
  goal.


  THE MAIN CHARACTER


  EUGENE


  Eugene is the audience''s main eyes throughout the VN. He''s responsible all of
  the growth affecting the men within this world.


  CURRENT ROUTES


  PHIL


  Phil the whale is a recent graduate with a business degree, Unfortunately, his new
  career at a big office has him starting off slumming it in the mailroom.


  Currently 1 out of 5 levels of growth available.'
