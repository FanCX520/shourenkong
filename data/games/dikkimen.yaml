description_full: "Welcome to Dikkimen！\n\nDuring a thrilling space adventure, the\
  \ crew of Dikkimen crash-lands on an exotic world brimming with adventure, treasures,\
  \ and a community of stunning beauties driven by desire.\r\n\nHugo and Benoit’s\
  \ journey is rich with emotion and filled with twists, delving deeply into love,\
  \ friendship, and self-acceptance. In this dazzling game, every moment is a celebration\
  \ of freedom and joy, unleashing yourself.\r\n\nDikkimen kicks off the “Zoo Carnival”\
  \ series with retro bara game charm and captivating characters. \n\n Experience\
  \ retro casual gameplay that not only excites but also transports you into a world\
  \ of dreams! \n\n Dive deep into the characters’ dreams, exploring how they support\
  \ each other through their joint adventures! \n\n Accumulate points or purchase\
  \ merchandise to unlock a variety of unique character skins! \n\n Connect with the\
  \ game characters through sex toys for a closer encounter. \n\n Exquisite visuals\
  \ paired with dynamic music create a game world that is both realistic and fantastically\
  \ unique. \n\n  Available for Mac,  PC, Linux, iOS and Android! \n\n We will officially\
  \ release in the 2025!\n Please visit our X / Bluesky for more news! \n\nThe ADAM's\
  \ from the Zoo Carnival series are launching on DSDC .\n\n Other games \r\n\n Untamed\
  \ Horizons by Colorinu.Games \n\n <a href=\" Barascend\" class=\"redactor-linkify-object\"\
  >https://colorinu-games.itch.io/barascend\">Barascend by Colorinu.Games</a> \n\n\
  \ Game development is intensively ongoing and set for release in early 2025.  Demos\
  \ will be updated continuously. Stay tuned! \n\n DEMO System Minimum Requirements:\
  \ \n OS:   Windows 10 (64bit)  |   Mac  13.0 (M1) \n Mobile:   iOS 15.0  (A13) | \
  \ Android 13.0 (Snapdragon 8 Gen2）\n Memory:  4 GB RAM | Storage: 2  GB"
