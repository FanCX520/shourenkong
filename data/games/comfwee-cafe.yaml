description_full: "Welcome to Comfwee Café! Here, you can receive comfort from three\
  \ gentle waiters.If something is troubling you, the waiters will do their best to\
  \ cheer you up! All they want is to make you feel better and treat you like you're\
  \ a part of their family. Though, they barely get customers in their café, so they\
  \ aren't making any profit... It's up to you to help them and their business!\n\n\
  (This game isn't trying to provide or be a replacement for therapy. It solely exists\
  \ to provide comfort and happiness for myself and hopefully you as well. ) \n\n\
  Around an hour playtime.\n\nSelf-insert plain MC.\n\nDegenerate mode and Wholesome\
