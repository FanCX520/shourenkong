description_full: 'What if Minesweeper was actually about mining ? Your goal in Dynamine
  is to mine for ores and sell them to make money while avoiding explosives. The rules
  are the same as the classical Minesweeper but inside an incremental mining game.
  Dig a cell to reveal its contents and find ores.


  Sell your valuables to make money , buy upgrades and special tools to help you dig
  and make money faster, then collect even more ores that you can sell to make even
  more money!


  Find the elevator in every layer of the mine to go deeper and reach the more valuable
  minerals. How deep can you go? Be careful though, the deeper layers are also more
  dangerous!


  Explore an infinite procedurally-generated world , find different biomes with different
  resources, find abandoned structures , and sometimes even special treasures.


  As you keep digging and your cave becomes larger and larger, you are going to need
  to set up minecart tracks to move around.


  Selling raw ores is not profitable enough anymore? Set up some furnaces to process
  them and increase their value!


  The numbers on the ground indicate how many explosives are in the 8 adjacent cells.


  Dig a cell to reveal its content. It could be empty, contain a mineral, or reveal
  a large open area. If you dig an explosive cell, it''s game over!'
