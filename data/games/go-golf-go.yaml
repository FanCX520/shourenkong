description_full: "Delson Schafer, with his sister Ashley, have entered the Golf God's\
  \ Game of Champions. If his aim is right, and they win the tournament, they can\
  \ get the money necessary to help their sick father. \n\nAlong the way he meets\
  \ an assortment of \"magical\" players, including one very red dragon - Rombarth\
  \ - who's returned to the game with a new perspective.\n\n Go Golf Go! is a short\
  \ furry romance visual novel that uses a golf tournament as the setting of the story.\
  \ 16.5k words. Can be read in ~2 hours. \n\nGenerally SFW (mild swearing and sexual language.)\n\
  \nDeveloped by ~eyematerror and ~HypoNova for the MAY WOLF VN Jam by ~Cody and ~WagleUnagi\
  \ (a.k.a. why some of the sprites look familiar :V )\n\nIt's the first-ever furry\
  \ romance visual novel about golf!"
