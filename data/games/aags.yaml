description_full: "Scroll to the bottom of the page or  click here  to download the\
  \ free demo.\n\nYou can download the demo without purchasing the full game or paying\
  \ any money. \r\n\n(In fact,  please  try it out first and ensure that it works\
  \ on your system AND that you like it before committing to a purchase.)\r\n\nAfterward:\
  \ A Gay Series (AAGS) is a fictional, contemporary, slice-of-life series of stories set\
  \ in the YAGS universe , following a gay man's journey of coming out, accepting\
  \ himself, and finding love. No prior knowledge of YAGS is necessary to enjoy the\
  \ series, although it does contain spoilers for works in the YAGS series of games\
  \ and writing.\n\n(If you're familiar with YAGS, then AAGS continues the story from\
  \ ZAGS after graduation, as Carlos and Adam move to San Francisco together.)\n\n\
  \ Note: This is a Kinetic Novel. That means that this game has no player choices,\
  \ and instead is more like a book with art. It does feature unlockable character\
  \ profiles that evolve as you read the stories as well as CGs (including some sexy\
  \ CGs) and minigames.\n\nIf you prefer to read the series in more traditional form,\
  \ most of the chapters are available for free  on my website .\n\nAAGS is a Kinetic\
  \ Novel and does not feature player choices. It does feature clicker-style minigames,\
  \ a CG gallery, and unlockable character profiles.\n\nThe free demo features:\n\n\
  30k words across 3 chapters\n\n3 (non-adult) CGs\n\nThe full version of AAGS features:\n\
  \n129k words across 22 chapters and 9 ficlets, including seven (and a half) not\
  \ available on the public website\n\n25 CGs, plus some secrets\n\nUnlockable and\
  \ evolving character profiles\n\n4 minigames\n\nA separate, free adult patch with\
  \ 13 additional CGs and extra content\n\nYour purchase also includes a behind-the-scenes\
  \ digital book (PDF) talking about the characters, sharing stories behind the game's\
  \ development, and including images from the process.\n\nYou can also obtain some \
  \ physical stickers . (Or see the  full set  of available YAGS-verse swag.)\n\n\
  AAGS follows a relationship between two homosexual men, and features uncomfortable\
  \ situations including homophobia, physical and emotional trauma, abusive relationships,\
  \ and parental rejection.\n\n The AAGS demo and full game are generally safe for\
  \ work (SFW) and include only passing references to sex. They contain no adult content.\n\
  \n A patch is available for the full version of the game with more explicit content,\
  \ including additional CGs. (Note that a patch is not available for the demo.)\n\
  \nYAGS, or Yearning: A Gay Story , is a traditional visual novel with dating sim\
  \ elements following a (different) gay man's journey of coming out and navigating\
  \ college life. Its sequel ZAGS, or Zen: A Gay Sequel , is a stat-based dating sim\
  \ also set in college.\n\nPlaying YAGS or ZAGS is not necessary to enjoy AAGS, as\
  \ the game includes a prologue chapter summarizing all character and plot information\
  \ necessary for the series. It also includes in-game unlockable and evolving character\
  \ profiles that can serve as a further reminder as you read.\n\nHowever, AAGS will\
  \ heavily spoil major plot points in both games and the YAGS universe as a whole\
  \ , so it is recommended that you enjoy the games first before consuming AAGS.\n\
  \nIf you're looking for games or visual novels with player choice, you will instead\
  \ want to check out other works in the  YAGS universe ."
