description_full: "Descend into the depths of the Target Planet's cave network to\
  \ retrieve a critical piece of cargo, encountering many horrifying obstacles and\
  \ problems on the way, to your character's dismay. Survival chances are near 0%—expect\
  \ to die a lot along the way.\r\n\nCaution and patience are greatly rewarded in\
  \ the depths. Any mistake can spiral into an ugly, permanent death.\n\nPlay the\
  \ tutorial before starting a run. It's good to understand some of the core mechanics\
  \ before descending.\n\nTranslations are available! Language files are placed in\
  \ the game's Data/Lang directory. The repo with them is  located here. Note: Most\
  \ translations aside from EN are unfinished, and not made by me.\n\n Discord server\
  \ \n\n Original Soundtrack \n\nThis game contains scenes of violence, gore and depictions\
  \ of depression and self harm."
