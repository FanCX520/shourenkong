description_full: "！！！该视觉小说仅为粉丝制作的非官方同人作品 ！！！\n\n！！！この作品はファンが作った非公式同人作品です ！！！\r\n\n\
  ！！！This visual novel is a fan made unofficial fan fiction ！！！\r\n\n这是一部作为青梅竹马的猫和狗，以及他们身边形形色色的人们所交织而成的青春恋爱群像剧。「我们来合租\
  \ 房吧！」——以这一句话为开端，因儿时玩伴兼挚友的犬兽人『赤木大智』的一句话而动摇的猫兽人『明石善人』，在半推半就下开始了与自己暗恋对象的心跳大学合租生活。\n\
  \n——————————————————————————————————————————\n\n幼馴染の猫と犬、そして周囲のキャラたちが織り成す青春恋愛群像劇。「シェアハウスしようって言ってんの」――その一言を皮切りに、幼なじみで親友だった犬獣人『赤木大智』の一言に動揺した猫獣人『明石善人』は、片思いの相手とのドッキドキ(?)でワックワク(?)なシェア生活が始まった。\r\
  \n\n——————————————————————————————————————————\n\nThis visual novel is a school romance ficition about a cat and a dog that are childhood playmates, as well as various people around them. \"\
  Let's shared house! \" –Shaken by such words, the cat Akashi Zento is beginning a heart-racing college roommate life with his childhood playmate and close friends, the dog Akagi Daichi —who he happens to, fortunately and unfortunately, have a long secret crush on.\n\
