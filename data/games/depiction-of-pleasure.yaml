description_full: "The world is flooded with a deathly addictive substance. The arrival\
  \ of a creature speaking a strange language disrupts the struggles of a king and\
  \ his loyal follower. Will they discover the nature of the creature and their world?\n\
  \nDepiction of Pleasure is a fantasy adventure story about indulgence, language,\
  \ and how we view ourselves. It contains partial nudity and no explicit material,\
  \ but features mature themes. If it were rated, it would be PEGI-16. Out of abundance\
  \ of caution, it's labeled as adult. It currently sits at 9k words which is about\
  \ an hour read.\n\nAll 74 sprites, 24 backgrounds, the 30 special assets, the 8\
  \ CGs with 115 variations, are hand painted and recorded and available in the devlog.\n\
  \nCheck out these other projects that the creators have worked on!\n\nphwog (Writing,\
