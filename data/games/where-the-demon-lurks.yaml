description_full: "Plot Summary \n\nExiled from the Underworld, the former Demon Lord\
  \ goes into hiding in the sleepy town of Kibbleton. Though he has resigned to his\
  \ fate, the forces that rule over Up Above and the Underworld are far from done\
  \ with him. Now that the peace he has longed for has been disturbed, how will this\
  \ demon respond? Take on the role of this ex-Demon Lord and meet a cast of demons,\
  \ angels and other magical and not so magical misfits. \n\nAbout the Game \n\nWhere\
  \ the Demon Lurks is a mostly kinetic SFW visual novel with a few branching parts,\
  \ and some occasional fan service.\n\n Content Warning: This visual novel may contain\
  \ mild violence, mild language and/or minimal suggestive themes, but this is mainly\
  \ a SFW VN.\n\nDo leave us a review here on Itch.io, we appreciate any feedback,\
  \ and it helps to recommend the game to others. Our updates are possible thanks\
  \ to our kind contributors on Patreon. If you want to see more Where the Demon Lurks\
  \ consider becoming a Patron for early update access and other special goodies.\n\
  \nDEVELOPERS:\n\nThis game is proudly brought to you by:\n\nWriter: Libra\r\n\n\
  Sprite Artists:   Cody Soh  ,  Ryuulabo  ,  TiggonTG  &  Ixkou \r\n\nCG Artist:\
  \ Hoggan  & Sang \n\nBG Director: Posporo \n\nBG Artist: Eli \n\nProgrammers:  Wattson\
  \  &  Blaboole \r\n\nEditors:  Nawah  &  Compymono   \r\n\nComposer:  Civ Valian\
