description_full: "In the great wide state of Philadelphia (yes, in this universe\
  \ it's a state) lies a small town named Cherry Hill . Located in the town's busy\
  \ streets is  Cherimoya College , a prestigious university filled with students\
  \ from all walks of life. \n\nAfter the fall semester, several of the college baseball\
  \ team's players graduated, leaving the team barebones. Given a lack of players,\
  \ many of the students will try their hand at becoming part of The Green Beetles\
  \ , incentivised by the promise of a scholarship. \n\n Follow the lives of  Jerry\
  \ Dalmond and Parker King , two students who cross paths at the beginning of the\
  \ new term.\n\n Jerry  is a 20 year old dalmatian who's currently a sophomore in\
  \ sociology. \n\nHe prefers not to stand out from the crowd but enjoys hanging out\
  \ with people. Jerry's considered a reliable person by many in his class. He's a\
  \ little bit of a low-energy goofball, the type of guy to take a shower in his clothes\
  \ so he gets two things cleaned. \n\nHis love life? Nowhere to be seen. Dust.\n\n\
  \ Parker  is a 21 year old kangaroo, currently in his junior year in Architecture. \n\
  \nHis looks and popularity from the baseball team might lead you to believe he’s\
  \ an extroverted guy. Well.. not exactly. While he’s not completely antisocial,\
  \ his people skills aren’t that great, and he struggles to open up to others.\n\n\
  His love life is great! ...Or at least it was until a few weeks ago.\n\nWatch their\
  \ story unfold from both of their perspectives. Reading both sides is recommended\
  \ to enjoy the full experience.\n\nCan love really bloom on the baseball field?\n\
  \n Will they be able to reach... SECOND BASE ? \n\n THIS VISUAL NOVEL IS SUITED\
  \ FOR MATURE AUDIENCES (+18)."
