description_full: "Strange Screentime : Alphur is a very short Visual Novel about\
  \ the small conversations we can have with strangers that you didn't know they needed.\n\
  \nYou download an old anonymous chat program called ' Alphur '. Going through various\
  \ topics and meeting other people, or sometimes no one even connects. \n\nListening\
  \ to the radio a song comes on and prompts another topic in your mind, \" 80's rock\
  \ \". Curious, you type it in as your next topic.\n\nLittle did you know this would\
  \ be your strangest encounter yet.\n\n You meet Donnoroch . A demon curious about\
  \ humans, but has never met one himself. Answer his questions and choose how you\
  \ want to  > respond . \n\nFeaturing:\n\n >   990 words\r\n\n >   4 endings\r\n\n\
  \ >   2 unlockable main menu images\r\n\nI made this game for the O2A2VN Jam (2022)\
  \ , and had fun doing so!\n\nThis is my first published Visual Novel, albeit short\
  \ but I guess that's the nature of the jam after all.\n\nI may pick up this concept\
  \ and extend on it more if there's enough interest as this did feel more like a\
  \ proof-of-concept rather than a full game. But I did try my best to at least make\
  \ the game feel like it can work standalone as-is.\n\nBut yeah, enjoy!! I sure enjoyed\
  \ making it."
