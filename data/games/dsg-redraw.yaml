description_full: 'DREAM SAVIOR GAKUEN - ReDraw


  (BxB, GxB, Drama, School, Mystic) 


  And you thought High School romances got complicated! As the doors open, welcoming
  you to your first year at an elite Art College, you wonder...will the art you create
  here have the ability to amaze? You never thought the guys you''d meet here would
  be the amazing ones. 


  Welcome back to Dream Savior Gakuen ~ ReDraw.


  (* This is a revamp/overhaul of my first ever VN that came out in 2008 (yes, almost
  a decade ago! I can''t believe it). I was in early college or just finishing up
  high-school myself...it''s hard to remember.


  Although I''ve moved on with "Let''s MEAT Adam", DSG has always had a special place
  in my heart and I think it did too for many early renpy adopters and visual novel
  readers alike.


  But don''t think it''s just the same VN with new graphics! A lot of it is being
  built from the ground-up plus tons of new features. So hopefully you''ll walk with
  me again down the halls of DSG...one last time.)


  FEATURES


  11 Endings including the new JAJA ROUTE end.


  Fully redone sprites of all the original cast,  animated using Live2D


  Original BG''s have replaced the old filtered photograph ones.


  Updated and cleaned up script/dialog.


  All new revamped musical score.


  Same ambiguous MC, so you can play as female/male romancing males.


  Revamped UI presentation.


  New CG''s and all the originals have been redone completely.


  100% free! But donations are greatly appreciated! :)


  YES!


  SOULSOFT is happy to announce that the revamp of the original DSG has been secretly
  in the works and is finally happening! Please join us once more, in the sunset dappled
  corridors of Dream Savior Gakuen...this time ReDrawn.


  A new imagining through dusting off of a decades old VN: Dream Savior Gakuen ~ ReDraw


  Wanna talk? Cool! You can leave comments here or for more in depth discussion and
  updates visit:  LSF "Dream Savior Gakuen - ReDraw" Thread'
