description_full: "The Human Heart! \n\nYou are a human, with a heart longing for\
  \ a partner.  Will you find your love amongst the mammals in this new yet familiar\
  \ world?\n\nThere are seven lads to choose from; Cade, Dylan, Rorik, Ace, Tyler,\
  \ Sidney, and Lars!\n\nWhich one can help you solve the struggles of your human\
  \ hear t?\n\nThis game is a SAFE FOR WORK , furry visual novel. \n\nHello as of\
  \ Friday, July 7th 2023 there are now TWO VERSIONS  of the game, please be sure\
  \ to check which one you are getting. Choose only one of the two versions to install\
  \ on your device, because I don't actually know if the two versions can co-exist\
  \ with eath other.\n\n The differences in versions: \n version 2.4 is the old version\
  \ but it is farther down the story line (up to day 6)\n version 2.6 (or the Reboot\
  \ ) is the newer better version but only up to day 3\n\n Bugs: \n> Update is still\
  \ fresh, haven't found bugs yet\n\n Support the creators: https://www.patreon.com/leothelionel\
  \ \n\nIf you have any bugs to report, please comment them down below, it would be\
  \ a big help <3"
