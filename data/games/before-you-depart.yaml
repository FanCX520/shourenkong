description_full: "Canines are often companions for life. Some can even be companions\
  \ in death... \n\nThis is a SFW visual novel, but player discretion is advised.\
  \ Our story deals with heavy topics such as:\n\nTerminal Illness\n\nMental Health\n\
  \nDeath & Grief\n\nThis project was made for the  May Wolf Visual Novel Game Jam\
  \ . Please go check out the submission made by the other developers!\n\nThis visual\
  \ novel is a 100% complete experience. Any updates made in the future will be for\
  \ bug fixes, quality-of-life improvements, or implementing features we didn't have\
  \ time to create.\n\nLove our story? Check out the  Before You Depart, Asset Pack\
  \ ! You can download high quality images and our original soundtrack."
