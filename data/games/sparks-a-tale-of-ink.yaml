description_full: "Overview\n\nAfter the so-called Sovereign ascended the world’s\
  \ throne as a new God, strange powers awoke in everyone inhabiting the planet.\n\
  \nZhangken, a student interested in this very history, has his doubts about the\
  \ truthfulness of the existing records on this tale.\n\nHe stumbles upon a clue\
  \ that steers him onto a road of discovery. Truths that were buried never to be\
  \ uncovered, await him.\r\n\nMysteries, monsters and the very workings of the world\
  \ are standing between him and his goals. Yet luckily, he does not have to overcome\
  \ these ordeals by himself, as his friends have his back along the way\r\n\nSparks\
  \ A Tale of Ink will branch into two routes in a later chapter for the reader to\
  \ discover different truths to piece the entire tale together on their own.\r\n\n\
  For information on the project, follow us on Twitter or join our Discord server!\n\
