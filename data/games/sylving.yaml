description_full: "ABOUT \n\nSylving is a furry visual novel with romance, adventure,\
  \ drama, action and comedy. Travel to another world where different anthropomorphic\
  \ people live, where a long history of conflict has been going between the Dyr,\
  \   Udyr and Eldor races for centuries, but not without reasons. You'll meet many\
  \ different characters and learn more about this world, but not everyone is what\
  \ they seem to be at first glance. \n\nSTATUS: vers. 0.4 Beta\n\nThis is a mostly-finished\
  \ version of the chapter, having all the new characters and the story ready to play.\
  \ most of the new backgrounds are still unfinished."
