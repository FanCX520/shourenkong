description_full: "Two lookouts meet in a desert, far from the sight of their gangs.\r\
  \n\nWith more in common than they could've expected, they scout out a town with\
  \ rumours of gold.\r\n\nWhat will become of this fateful meeting?\r\n\n-----------------\n\
  \nLookouts is a romance visual novel about two gay trans masc outlaws in the old\
  \ west, finding refuge in each other, and a little hope for a better life.\n\nWith\
  \ roughly 45,000 words of story and a 5-6 hour reading time, it's a much expanded\
  \ version of the original made for the Gay Western Jam. The original jam version\
  \ can be played  here !\n\nControls: Click or press spacebar to progress/show dialogue.\
  \ The menu bar will show up in the top right hand corner if you tap/mouse over it.\r\
  \n\n Loading the game in the browser version may take a while depending on your\
  \ internet connection. If it looks like it isn't loading, don't worry, it is! Just\
  \ give it a minute or two. \n\nCW for: alcohol, smoking, gun violence (with SFX), gun\
  \ death, blood, injury, mild transphobia, discussions of racism and settler violence.\
  \ Injuries aren't described in graphic detail but there are some visual aids and\
  \ allusions.\n\n-----------------\n\nMade with love by:\r\n\nCol (Art and Character\
  \ Design)\r\n\nHawky (Programming and Story)\r\n\nFeaturing music by the talented\
  \ Jamiee of  fakegamercomics \r\n\n Marble Claws is Hawky and Col's next venture\
  \ in making games. Check the team's itchio account here , tumblr here , and Bluesky\
  \ here .\n\nIf you'd like to get in contact regarding Lookouts, feel free to email\
  \ us at marbleclaws [at] gmail [dot] com.\n\n-----------------\n\nIf you enjoyed\
  \ the game and want some extra super cool stuff, consider buying the  Gold Edition\
  \ of Lookouts. If you click the Download Now button, for only £5/$6.50 you get a\
  \ zip file containing:\n\nHigh quality original versions of all the art from the\
  \ game\r\n\nExclusive wallpapers for desktop and mobile\r\n\nThe full banging OST\n\
  \nA bunch of extra original art of doodles and designs by Col\r\n\nFive mini comics\
  \ with the characters\n\nA development artbook\n\nThe Lookouts OST  by Jamie can\
  \ also be bought and listened to individually over here on Bandcamp! \n\n Merch\
  \ is available now! Go to our store to buy Lookouts stickers, postcards, shirts,\
  \ or a physical edition of the artbook!  https://marbleclaws.bigcartel.com/"
