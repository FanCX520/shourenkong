description_full: "\"Thank you for your service.\"\n\nAfter years on the battlefield,\
  \ Darius Creed wants nothing more than silence — a nice, quiet life. But peace is\
  \ a different kind of war, and there's no place for a soldier who only knows how\
  \ to execute commands. Just when the world feels most distant, he finds a reason\
  \ to stay. Someone who fought without guns. Someone who made the silence feel like\
  \ home. Someone more of a hero than himself.\n\nBut peace doesn’t last. War always\
  \ takes away from the undeserving. When everything Darius believes and has is taken\
  \ away, he must prove he deserves the title of a hero.\n\nMeet different characters\
  \ and navigate through the conflicts. The past is already set in stone, but your\
  \ actions determine how the story unfolds. Stay virtuous or embrace your justified\
  \ fury.\n\n- 3 different endings available. (in progress)\n- Obtain medals of honor \
  \ to get 100% in the achievement room. (in progress)\n\n This game is best enjoyed\
  \ with a full audio experience. \n\nFeaturing:\n\n-  Full audio experience. \n-\
  \ Stylized visual direction.\n- Exploration mode and minigames!\n\nThis game contains\
  \ loud noises and covers sensitive topics, including but not limited to: death,\
  \ homophobia, war, and Posttraumatic Stress Disorder (PTSD).\n\nCREDITS\r\n\n- Audio\
  \ stock assets by Uppbeat, Pixabay\n- Visual stock assets by Unsplash, Pexels, Pixabay"
