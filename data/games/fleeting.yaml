description_full: "A space cadet far from home does some soul-searching ...\n\nMasa\
  \ Takeshiro* is a third-year cadet plagued by nightmares, loneliness, and a lost\
  \ sense of self. His friend and recent Academy graduate, Ens. Jericho Santana, is\
  \ acting as his mentor to help him find his way and himself. But young Takeshiro\
  \ and Santana run into trouble when Academy legend, Lt. Kaimana Warner, boards the\
  \ ship with a strange prisoner...\n\n- - -\n\nThe developer recommends readers/viewers\
  \ be 16 years and older.\n\n CONTENT WARNING \r\nFlashing images, jump scares, blood,\
  \ mild violence, mild language \r\n\nDemo Features\n\n3 Love Interests\n\nOriginal\
  \ Backgrounds\n\n3 CGs + CG Gallery\n\nSkippable dungeon crawler\n\nPlanned Features\
