description_full: "Turning 18 is a milestone for anyone, and for Mikey, it means he's\
  \ not just headed toward adulthood... he's already there! \nHis mediocre soccer\
  \ team's scheduled for an exhibition match with the preppy high school across town.\
  \ Do they even stand a chance? Navigating life as an adult and relearning teamwork\
  \ has never been more tiresome. To top it all off, he's still got all the normal\
  \ problems of grades, friends, bullies, school dances, and girls…\n\nWhat the hell\
  \ went wrong?\r\n\n Fields of Spring is a kinetic visual novel (no choices) and\
  \ is an adult fiction that features themes and scenarios that may not be suitable\
  \ for all ages. Please be aware, and do not read if you are not over the age of\
  \ 18.\n\n Credits: \n\nDirection, Script, Music - Eymon \n\nSprites, Backgrounds,\
  \ Illustrations -  Coffyeen \n\nUI Design -  Syktur \n\nEditing, Proofreading, Consultant\
