description_full: "BURNING SNOW is a short atmospheric experience about staying warm\
  \ in a cold forest and eventually launching a firework. Seek matches and make fire\
  \ while a mysterious cat companion guides you through the forest.\n\n Features:\
  \ \n\nLight matches and burn branches to stay warm in a freezing forest\n\nA mysterious\
  \ talking cat companion \n\nShort, focused experience (roughly 10 minutes)\n\nOriginal\
  \ soundtrack\n\nRetro-inspired visuals \n\n This is my first-ever 3D game , so I\
  \ really hope you find it fun! I mostly focused on the visuals and tried to make\
  \ the game as polished and atmospheric as I could! Please enjoy! :)\n\nYou can also\
  \ follow me on  Bluesky  or  X (Twitter)  for more stuff.\nI also just made a  Discord\
  \ Server for updates and early testing of my future projects. Feel free to join!"
