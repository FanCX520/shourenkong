description_full: "Patches is dragged to school for the first ever cat-and-dog school\
  \ day! With Coco and Brownie distracted with home ec class, Olive and Angel busy\
  \ with literature, and Sparky and Ginger occupied by gym, Patches has free reign\
  \ over the school... Almost. \n\n All he needs to do is get this damn collar off\
  \ and wreak some havoc! Will  he prove cats and dogs can get along, or will he make\
  \ this the Purrfect Apawcalypse? \n\n  ~~~\r\n\n This game contains cartoon gore,\
  \ bifurcated dogs, headless dogs, generally dogs not having a great time, along\
  \ with strong language and mature themes. Recommended for ages 15+, play at your\
  \ own discretion!  \n\n ~~~\r\n\nPurrfect Apawcalypse is a dark comedy interactive\
  \ fiction about dogs, cats and the apocalypse. The places you go, characters you\
  \ meet and choices you make will lead you either to death or happiness, so choose\
  \ wisely!\n\nThis game was created by Denny with programming help by Andy and music\
  \ by Lyon , created using Renpy ! Follow us on social media to stay updated, check\
  \ out the OST on YouTube , get behind the scenes content on our Patreon or get merch\
  \ from our store ! Thanks for playing!\n\nPortuguese (Brazil) translation by Rance\
  \ Guertena !\r\n\nRussian translation by Кузня Переводов !\n\nChinese translation\
  \ by 荼郁 and 雾子!\r\n\nJapanese translation by Japanese translation team !\r\n\n~~~\n\
  \nThis is the final game in the trilogy! Play them in this order!\n\n Love at Furst\
  \ Bite \r\n\n Purrgatory Furever \r\n\n Patches' Infurno"
