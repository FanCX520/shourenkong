description_full: "An experiment in letter writing, meant to evoke the distinctly\
  \ sweet homoeroticism of Victorian and Edwardian literature. Follow the correspondence\
  \ of two professors, in the months before one of them makes a decision he'll never\
  \ be able to take back.\n\nA visual novel with a cute mechanic: Slide the letters\
  \ back and forth across the screen, to experience the time the letter is written,\
  \ and when it is read!\n\nAbout 10,000 words in length,\n\nA fantasy setting with\
  \ demons,\n\nTwo scientists, one of them arguably quite mad!\n\nIf you enjoyed this\
  \ game, you can continue Harry and Hawley’s story in: The Case of the Serialized\
  \ Killer! \n\n <a href=\"<a href=\"https://alexisroyce.itch.io/murder-mystery\"\
  >The\" class=\"redactor-linkify-object\">https://alexisroyce.itch.io/murder-mystery\"\
  >The</a> Case of the Serialized Killer by AlexisRoyce, Camden Dawn, Tsushi</a>"
