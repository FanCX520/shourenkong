description_full: "Fire and Dice\n\nDice up the competition before you're slain.\r\
  \n\nFire and Dice was made during GMTK Game Jam 2022 .\n\n Thank you all so much\
  \ for playing and rating! \n\nTo celebrate we are in the making of some updates!\
  \ A couple of new features in testing include:\n\nFaster gameplay\n\nImproved enemy\
  \ waves\n\n Dice storage for saving a dice for later use\n\nControls\n\nHold and\
  \ drag a dice to move it\n\nPress Attack to deal damage to the adventurers\n\nTeam\n\
  \n Golen , ArcticFqx (code)\n\n Luxx , Konix , Lumie (art)\n\n Matojeje , Kiu (audio)\n\
  \nWilon (concept)\n\nSoundtrack is available here !"
