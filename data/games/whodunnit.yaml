description_full: "Howie Falk has a tough time being anything on purpose.\n\n... and\
  \ then he got laid.\n\n WHODUNNIT is a comedic mystery visual novel following a\
  \ man who must answer a burning question: who the hell did he hook up with last\
  \ night?\n\nAnd just who did he think he was when he said yes?\n\nConduct investigations\
  \ through point-and-click mechanics, interrogate a large cast of characters, and\
  \ cobble together theories as Howie chases down the ghost of his own gay virginity\
  \ — and trips, repeatedly, over the problems of everyone else.\n\nReactive dialogues\n\
  \nA fully original, jazzy soundtrack \n\nHand-drawn environments with animated elements\n\
  \nStylish, kinetic menus and screens\n\nQuality of life/accessibility features like\
  \ line pinning, performance mode, toggled sentence pausing, and reduced motion/camera\
  \ effects\n\n Support us on Patreon! \n\nBy subscribing to us on Patreon, you will\
  \ get access to early builds when they're available, an exclusive Discord role,\
  \ development logs/write-ups/updates, and support our objective to keep our games\
  \ completely free .\r\n\n Wishlist the game on Steam! \n\nWishlists are incredibly\
  \ helpful to help the game get momentum on Steam, in order to reach new players\
  \ and get opportunities. We'd really appreciate your wishlists and reviews on the\
  \ demo!"
