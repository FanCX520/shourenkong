description_full: "Synopsis \n\n Christmas is here! Yet despite all the holiday cheer,\
  \ there's no one you can call near or dear... \n\nYou thought this Christmas would\
  \ be the exact same as all the other ones, but then your reindeer plushie turned\
  \ into a giant himbo?! Maybe this year won't be so lonely, after all!\n\n Features\
  \ \n\nAlmost 4,000 words of story!\n\nAbout 10-15 minutes of playtime!\n\n2 epilogues\
  \ to see after the main ending!\n\nOST of 6 tracks!!\n\nSuper cute himbo that loves\
  \ you unconditionally!!!\n\nBrief himbo therapy session (not actually therapy plz\
  \ don't sue)\n\nLike... at least 4 references to Christmas songs?\n\nMobile platform\
  \ support (Android and iOS)\n\n Soundtrack \r\n\nAvailable on  YouTube  and SoundCloud\
  \ !\r\n\n Disclaimer \n\n Himbo Hymns contains suggestive themes and himbo shenanigans."
