description_full: "Traducción castellana aquí. \n\nElder Travis Hartley is right on\
  \ track.\n\nHe's spent the last six months getting accustomed to life as a Mormon\
  \ missionary in the South American nation of Paraná.\r\n\nNow, however, come two big\
  \ shifts: he's been reassigned to a small rural town that hasn't hosted missionaries\
  \ for years — and to train a brand-new missionary. Both big responsibilities.\r\n\
  \nBundled off on a bus beside his new companion, Elder Hartley has his work cut\
  \ out for him: getting to know his companion, the local church members, and the\
  \ town, all while spending ten hours per day in the sweltering January sun trying\
  \ to find and teach anyone,  anyone , who's interested.\r\n\nHe knows who he is\
  \ and why he's here. He knows how to be personable, how to preach, how to plan. He's\
  \ got this. Yeah.\n\nEverything is fine!\n\nThat is, of course, until everything\
  \ starts to go... off the rails. In unsettling ways. Impossible ways. Ways he can't\
  \ believe or explain...\n\nNarrative Map\n\n Released,  Not yet released,  Partially\
  \ released \n\n Prologue \n Branch 1: My Mission \n Route 1: Ciervo \n\n Route \n\
  \n Branch 2: My Neighbor \n Route 2: Bifurcados \n\n Route \n\nNotes on Content\n\
  \n Campo Largo is SFW. If it were a film, it would be rated PG-13 for intense themes.\
  \ More detailed content warnings are presented in the visual novel where applicable.\
  \ \r\n\n Campo Largo i s a work of fiction that takes inspiration from the author's\
  \ experiences and research. While some locations, characters, and events are inspired\
  \ by reality, they have all been composited, anonymized, extrapolated, recontextualized,\
  \ and/or fictionalized for dramatic effect. \n\n Development is already far advanced.\
  \ The full text of the visual novel is written, with all art assets complete and\
  \ coded. Sound effects and music remain to be completed. \n\nCredits\n\n Writing,\
