description_full: "Olive the mutt finds themself trapped in Hachiko High School during\
  \ the apocalypse! Demons have been slaughtering their classmates and they're certain\
  \ it's inevitable that they too will meet their untimely end... Which means there's\
  \ only so many dogs left to spend their last moments with! \n\n Join Olive in their\
  \ grisly search for a special someone! Will it be Brownie the snack-loving corgi,\
  \ Sparky the sporty husky or Patches the dalmatian bookworm? It's all up to you!\
  \ \n\n~~~\n\n This is a remake of Purrfect Apawcalypse , the original first game!\
  \ All the art has been updated, complete with some new music, new dialogue and more\
  \ \n\n This game contains cartoon gore, bifurcated dogs, headless dogs, generally\
  \ dogs not having a great time, along with strong language and mature themes. Recommended\
  \ for ages 15+, play at your own discretion! \n\n ~~~\r\n\nPurrfect Apawcalypse\
  \ is a dark comedy interactive fiction about dogs, cats and the apocalypse. The\
  \ places you go, characters you meet and choices you make will lead you to either\
  \ death or happiness, so choose wisely!\n\nThis game was created by Denny with programming\
  \ help by Andy , created using Renpy ! Follow us on social media to stay updated,\
  \ check out the OST on YouTube , get behind the scenes content on our Patreon or\
  \ get merch from our store ! Thanks for playing!\r\n\nSpanish (Spain) translation\
  \ by JesterAGR !\n\nPortuguese (Brazil) translation by Rance Guertena !\n\nPolish\
  \ translation by Paweł G !\n\nUkrainian translation by  Yuliia Vlaskova , testing\
  \ by Yuliia and  Alien Anberlin !\n\nChinese translation by 荼郁 and 雾子!\n\nKorean\
  \ translation by DelMik !\n\nJapanese translation by Japanese translation team !\n\
  \n~~~\n\nThis is the first game in the trilogy! Play them in this order!\n\n Love\
  \ at Furst Bite \n\n Purrgatory Furever \n\n Patches' Infurno"
