description_full: "A call for help within a mysterious messaging app. Someone lost\
  \ and wandering through a forest in a faraway place. And their destiny in your hands.\n\
  \n Beek: How I Became a Familiar Spirit and Everything After That is a text-based\
  \ narrative experience from the creators of Nekojishi. Featuring dozens of branching\
  \ paths, multiple endings, and CG's to unlock!\n\n Help Beek seek a way home, and\
  \ face the darkness of this world with strength and courage.\n\nBeek - Familiar\
  \ Spirit is playable in English. Traditional Chinese (繁体中文), Simplified Chinese\
  \ (简体中文), Japanese (日本語), German (Deutsch), and French (Français).\n\n-  Soundtrack\
  \ also Available \n\n Support us on  Patreon  to see development blogs and support\
  \ our future work! \n\n Note: \n\nBeek - Familiar Spirit is available for free to\
  \ download from the App Store and Google Play, however the version available here\
  \ is DRM-free and includes the purchasable CG pack.\n\nThis game was designed for\
  \ mobile devices and we recommend you play on one for the best experience. However,\
  \ certain real-time gameplay mechanics have been modified on the PC/Mac version\
  \ to account for this."
