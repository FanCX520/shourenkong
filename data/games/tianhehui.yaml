description_full: "The story of Tianhehui tells about the adventure of an ordinary\
  \ novelist, Tex, who comes all the way from Moro and sets foot on this eastern continent,\
  \ the country of Xi in order to draw materials and expand his horizons.\n\n In order\
  \ to recover what is stolen by a thief, a very precious treasure to him, Tex chooses\
  \ to entrust these two kind-hearted people who have a sense of justice, white Wolf\
  \ and yellow tiger, Who named Bai Yu and Chen Hu . \n\n Joining the Team at their\
  \ invitation, this is where the story begins... \n\n The hidden unknown past and\
  \ riddle over the years on Tex will involve him in a huge dispute which would launch\
  \ a new era on this eastern continent. \n\n Welcome, to the world of Tianhehui...\
  \ \n\n (Update 19/01/2024 English Version released.)\n （Questions for the English\
  \ version in the comments section） \n\n Discord Channel \n\n Bluesky Page \n\n (If\
  \ you want, we welcome you to participate in English translation.) \n\nP.S: Check\
  \ the devlog if you cannot open the game. CHECK THE DEVLOG !"
