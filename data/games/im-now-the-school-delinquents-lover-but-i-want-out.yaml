description_full: "Your final high school year; a time for making memories, friends,\
  \ living life to the fullest! ...Unfortunately for Akahana Haruto, it seems like\
  \ this year, too, he'll remain the same old invisible classmate, going about his\
  \ day in silence and solidute. But when the leader of the delinquent group in school\
  \ makes a surprise confession, Haruto's life goes from quiet to chaotic in five\
  \ seconds flat!!\n\nWill he be able to escape the clutches of the terrifying delinquent?\
  \ Or is chaos just the thing to spice up his quiet school life?\n\n This game was\
  \ created for the May Wolf Game Jam 2024 hosted by  WagleUnagi . All assets, writing,\
  \ and coding were created from the start of May to the date of this Visual Novel's\
  \ release!"
