description_full: "So what if one day you were kicked out of your apartment , trying\
  \ to cope you go to the nearest café and suddenly your whole view on the world gets\
  \ shifted because you learn that... DEMONS EXIST? \n\nYou're taken under the wing\
  \ of two demons, who are more than willing to teach you about their kind and what\
  \ it's like to have to hide your true self from the public eye.\n\nIt's not going\
  \ to be easy to adapt, but at least you don't have to do it alone. Would you burn\
  \ yourself to bare your soul, or return to the walled but easy life you once had?\n\
  \n Flicker of Azure  is a low fantasy visual novel with elements of romance, about\
  \ how something so miniscule can shift ones perspective of the world completely.\
  \ \nAlso, that it's rude to stare. \n\nThe current state of the game is a demo,\
  \ which includes :\n\n5k words\n\nPlayer character color customization\n\nAnimated\
  \ sprites\n\nA preview on what's to come\n\nThis game is currently in development\
  \ and is being made by a sole developer, Pann.\n\nThis game initially was made during\
  \ the  NaNoRenO 2023 game jam, which is to create a visual novel over the course\
  \ of a month. \n\nThe game's demo at its current released state is lacking features\
  \ due to the time constraints of the game jam, BUT there will be a full release.\n\
  \nWill be in the full release :\n\nThe rest of the story, including a chance to\
  \ romance Wez ( and if all goes well, perhaps other characters too... )\n\nRedone\
  \ and more backgrounds, with time-of-day variation\n\nMusic, as the demo only has\
  \ a menu theme.\n\nCompleted custom UI\n\nVarious visual assets\n\nThe gallery\n\
  \nMore CGs\n\nThe game's first full version release is aimed to be at some point,\
  \ hopefully.\n\n Credits: \n Portrait System -> Taylor and Bryan Tsang \n Everything\
  \ else (Art, Writing, Coding, Music, ect.)  -> Pann"
