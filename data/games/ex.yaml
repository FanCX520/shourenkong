description_full: "FINAL RELEASE AVAILABLE! \n\n( ¡Sigue bajando para la descripción\
  \ en español! )\n\nJorge is kind of a dick, but now he's forced by circumstances\
  \ to act like a responsible adult. So he finds a good job in a multinational company,\
  \ which he's really happy about... until he finds out that he will have to work\
  \ with four of his exes!\n\nIn this romantic comedy in an office setting, you'll\
  \ help Jorge interact with his exes on a daily basis, while trying to clean his\
  \ karma and make up for all the crap he used to do to them.\r\n\n - Features: \r\
  \n\n * 285k words. \r\n\n * Many cutscene illustrations. \r\n\n * Business trips,\
  \ dates, and a waterpark special event! \r\n\n * Chat with the potential boyfriends\
  \ and get closer to them! \r\n\n* Receive pin-up pictures during phone chats! \r\
  \n\n * Two interactive foreplay scenes! \r\n\n * A polyamory route with Jacob and\
  \ Gabriel. \r\n\n * English only (full game) \n\n * Spanish translation (common\
  \ part + Jacob route) \n\n - In further updates, we are planning on: \r\n\n * Full\
  \ translation into Chinese, Spanish, and Catalan. \r\n\n WARNING : The game has\
  \ a +18 and a +15 versions. At the start of the game, you'll get the option of choosing\
  \ between them. So if you prefer a safe-for-work version or want to share a gameplay\
  \ of the game, we've got you covered!\r\n\n DEMO AVAILABLE IN ENGLISH, SPANISH AND\
  \ CATALAN \n\n       ---------------------------------------------------------------------------------------------\n\
  \n ¡¡LOS EXES ATACAN!! \n\nJorge siempre ha sido un cabeza loca, pero se ve obligado\
  \ por las circunstancias a portarse como un adulto responsable. Así que encuentra\
  \ un trabajo en una multinational, lo que parece un sueño hecho realidad... ¡hasta\
  \ que descubre que va a tener que trabajar con cuatro de sus ex novios!\r\n\nEn\
  \ esta comedia romántica de oficina, tendrás que ayudar a Jorge a interactuar con\
  \ sus exes todos los días, mientras intenta limpiar su karma y resarcirles por todo\
  \ lo que les hizo en el pasado.\r\n\n AVISO:  Al principio del juego encontrarás\
  \ la opción de jugar a esta novela visual sin censurar (+18) o un poco más \"apta\"\
  \ (+15). \n\n De momento, solo la parte común y la ruta de Jacob están traducidas\
  \ al español. \n\n LA DEMO TAMBÉ ESTÀ DISPONIBLE EN CATALÀ!"
