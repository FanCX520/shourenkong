description_full: "You're an elite member of the search-and-rescue team sent by \"\
  Black Ravens\" security organization. Your squad's task is to collect information\
  \ and find any survivors.\n\nWelcome to the \"Envelope\" research institute.\n\n\
  Copycat's Phenomenon is an experimental multiplayer pseudo-action horror game that\
  \ I've been developing since February, 2019.\n\n Features \n\nCreepy atmosphere.\
  \ What was that shriek?\n\nBuggy multiplayer. Play with your friends.\n\nDark environments.\
  \ Use any available light sources.\n\nPlayer classes and characters. Each has their\
  \ own items and advantages.\n\nRandomly generated maps. Each time new facility."
