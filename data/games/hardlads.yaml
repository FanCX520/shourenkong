description_full: "Hard Lads is a short game about shirtless hunks who smoke, drink,\
  \ kiss, and hurt each other.\n\nby Robert Yang ( debacle.us , @radiatoryang )\n\n\
  In 2015, the video   \"British lads hit each other with a chair\" went viral across\
  \ the internet. Hard Lads casts the player as the cameraman and director. Be a proper\
  \ hard lad or a surreal soft lad. The choice is yours! \n\n>> For more info, read\
  \ my artist statement \"Hard Lads as an important failure.\"\n\n >> 50% of June\
  \ and July 2020 proceeds were donated to the Black Lives Matter UK Fund . Thanks\
  \ to you, we raised £468.00 GBP to support a coalition of Black activists and organisers\
  \ across the UK. \n\n LANGUAGES SUPPORTED: English, Français, 日本語, Русский, 简体中文,\
  \ 繁體字, Deutsch, Español, العَرَبِيةُ, Čeština, Italiano, 한국어, Português, Polski\
  \ \n\n PLATFORMS: Windows 7+ 64-bit, MacOS 64-bit, Linux 64-bit (Ubuntu 12.04+)\n\
  \n CONTROLS: Mouse or trackpad, most gamepads supported, basic keyboard support\n\
  \n DURATION: 5-20 minutes.\n\n LADS: 4\n\n MUSIC: \"Str8 Acting\", \"im so bored\"\
  , \"Sexy From Behind\" by Lynks  ( Spotify ). Menu music by Ella Guro . Ending sing-along by\
  \ Puma Hardchorus , artistically appropriated under fair use.\n\n PRESS: Art in\
  \ America , Kotaku , Rock Paper Shotgun \n\n MORE MASCULINITY GAMES BY ROBERT YANG:\
  \ Cobra Club HD , Rinse and Repeat , Radiator 2 , The Tearoom \n\n WANT E-MAIL UPDATES\
  \ FOR THIS AND OTHER SEXY GAMES?   Sign-up for the Radiator e-mail newsletter .\
  \ 1-3 emails / year at most.\n\n IS THIS \"SAFE FOR WORK\"?  Much like the viral\
  \ video, this game features mens' nipples, smoking and drinking, and consensual\
  \ cartoon violence. It would be considered PG-13 by most people.\n\n IS THE GAME\
  \ CRASHING OR RUNNING SLOWLY? See tech support / troubleshooting here. To avoid\
  \ problems, especially on macOS, please use the free open-source official \"itch\"\
  \ app for automatic install and patching.\n\n SPECIAL THANKS to Eddie Cameron (macOS\
  \ notarization hell, playtesting) and Rami Ismail (Arabic localization consultant)"
