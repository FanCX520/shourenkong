description_full: "Special Note from the Meant to Bee Studios Team! \n\n We will not\
  \ be taking donations for our games, but if you feel so inclined please consider\
  \ donating to the Maui Strong Fund in relation to the wildfires in Hawaii. \r\n\n\
  \ Resources/Info: \r\n\n https://www.kitv.com/news/lahaina/how-to-help-those-impacted-by-the-maui-fires/a...\
  \ \r\n\n Fund: \r\n https://www.hawaiicommunityfoundation.org/maui-strong \n\nMakai\
  \ and Rhett have two things in common, they both work at Cloudville beach, Makai\
  \ as a lifeguard and Rhett as a bartender. \n\nThey also slept together. \r\n\n\
  Makai and Rhett both want to see each other again, and as luck would have it they\
  \ are able to. \n\nAs they both have to work together to plan Cloudville Beach’s\
  \ annual Luau, with the help of their two best friends: Lola and Sunny.\r\n\nWill\
  \ this be the hottest summer yet? Or will it go down in flames? \n\n30K words (7\
  \ Chapters + Epilogue) \r\n\nSFW Romance (but plenty of mentions/jokes about sex)\n\
  \nSplit POV of our 2 leads Rhett and Makai! \n\nThis is a kinetic novel so no choices\
  \ or branching paths.\n\n4 Gorgeous CGs!\r\n\nOriginal artwork throughout made by\
  \ real people!\r\n\nOriginal soundtrack!\r\n\nPartial voice acting!\r\n\n Creative\
  \ Director, Casting Director, Social Media Manager, and Writer: Flowersforjoy/Joy\
  \ \n\n Programmer: Snakkiez \n\n Sprite/CG Artist: VeryFatCat \n\n Background Artist:\
  \ Pinachs \n\n GUI Artist: Farb \n\n Logo Designer/Beta Reader: Olivia \n\n Composer:\
  \ Orpheo Fenn/ Faefield Productions \n\n SFX/Audio Design: Jojo Worthington \n\n\
  \ Beta/Proofreaders: Chimeriquement , Sylvia Wilde , LuluCat , and Samantha Laine\
  \ . \n\n Playtesters: Lacydigital ,  Trenton Butt\n\n Trailer: Lacydigital \n\n\
  \ Makai Kawai: Trenton Butt \n\n Rhett Cyrus Walker: Mark Stiehl \n\n Lola Castillo:\
  \ Priscilla VA/Trixify \n\n Julian \"Sunny\" Hill: Steven Etienne \n\n Bartender:\
  \ Lily Yatsuda"
