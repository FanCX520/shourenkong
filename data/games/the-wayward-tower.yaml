description_full: "Também disponível em Português Brasileiro! \n\n También disponible\
  \ en Castellano! \n\n Warning \n\nThis story delves into topics such as chronic\
  \ conditions and a brief moment describing blood, self-inflicted wounds and scarring.\
  \ While this project features no explicit adult scenes, viewer discretion is advised.\n\
  \nFollow a man cursed to roam the world without ever finding a home, as the road\
  \ once more leads him to a mysterious tower where a wolf-like wizard lives in peaceful\
  \ solitude. \n\n The Wayward Tower was made for the MAY WOLF 2024: MY WOLF Furry\
  \ Visual Novel Jam (18+). \n\n Team Members: \n\nConcept and CG Artwork by Baldoh \
  \ \n\nCoding & Writing by Cardigan (Linktr.ee) \n\nCoding & UI Elements by Erebus\
  \ \n\nSprite Artwork by Metrio (Ko-fi) \n\nOriginal Music Tracks by OriginOfMajesty\
  \ (Ko-fi)"
