description_full: "简介\n\n 当时代向前、过往已逝，到底是徘徊在过去，还是走向未来？ \r\n\n当古董店的生活回旋在琐碎和迷茫中、无处可去时，一封来自远方的奇怪委任被投入埃利的。他无法料想未来一周当中会发生的事。\r\
  \n\n在这场冒险般的旅行当中，或许他帮助的不仅有自己，也是另一个在黑夜中徘徊的孤单灵魂。\r\n\n内容说明与须知\n\n 内容预警： 本游戏含有furry元素。请在了解并接受后继续。\r\
  \n\n 语言支持： 目前本游戏仅支持中文，未来可能会提供翻译版本。\r\n\nIntroduction\n\n As time marches forward\
  \ and the past fades away, do we linger in what was, or step toward what is to come?\
  \ \r\n\nWhen life at the antique shop spiraled into a cycle of trivialities and\
  \ aimless wandering, Ery never could have imagined what the coming week would hold—all\
  \ sparked by a strange commission letter dropped into his mailbox.\r\n\nIn the journey\
  \ ahead—an adventure born of chance—Eli may find that he isn't just helping himself,\
  \ but also another lonely soul wandering through the dark of night.\r\n\nContent\
  \ Warning & Info\n\n Content Notice: This game contains furry elements. Please proceed\
  \ only if you are aware and accepting of this content.\r\n\n Language Support: Currently,\
  \ the game is only available in Chinese. Translated versions may be provided in\
  \ the future."
