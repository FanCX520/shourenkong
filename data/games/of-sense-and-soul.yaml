description_full: "In 1875 London, an editorialist and a gentleman have an unusual\
  \ first meeting through a misconstrued personal ad. Their paths intertwine as they\
  \ struggle against their own regrets and ways, and they must decide which to follow:\
  \ their hearts, or the status quo. \n\n Of Sense and Soul is a story lost to time,\
  \ centred on two men navigating the smog-covered streets of Victorian London:  Hugo\
  \ Brooks , a reserved editorialist who never adventures far outside the written\
  \ word, or  Seamus Charkham , a confirmed bachelor who would sooner move forward\
  \ blindfolded than look to the past.\n\nBoth are set in their ways, and both are\
  \ in desperate need of a change, though loath to admit it. Despite wanting to believe\
  \ they’re satisfied with continuing on as they have been, they find that sometimes,\
  \ things can change for the better — and that the marks we leave on the lives of\
  \ those around us are so much greater than we realise.\n\n Of Sense and Soul is\
  \ a late-Victorian character-driven slice of life romance visual novel and the first\
  \ game by Forsythia Productions.  It will be available for PC, Windows, and Linux.\n\
  \nThe full release date is to be announced.\n\n   Wishlist on Steam \n\n Chat with\
  \ us on Discord \n\n Join our Newsletter \n\n  Website  | Socials  | Press Kit \n\
  \n Disclaimers and Content Warnings \n\n Of Sense and Soul  will be rated 15+, with\
  \ mentions of alcohol consumption and smoking. No graphic themes or imagery will be\
  \ included.\n\nThis is a work of fiction. Names, characters, places and incidents\
  \ either are products of the developers' imagination or are used fictitiously. Any\
  \ resemblance to actual events or locales or persons, living or dead, is entirely\
  \ coincidental. \n\n The full game is planned to contain... \n\nA researched, robust\
  \ Victorian England setting \n\nDetailed watercolour-inspired visuals\n\n2 player\
  \ routes with multiple endings\n\n100,000+ words of story in three acts, comprising\
  \ about 8-12 hours of gameplay\n\n18 scene illustrations/CGs\n\nTimed choice menus\
  \ and writing composition menus\n\nMultiple accessibility options\n\nFully original\
  \ soundtrack\n\nPartial voice acting\n\nA lot of gay pining and introspection\n\n\
  \ The OSAS Extended Demo contains... \n\nThe prologue and a little over half of\
  \ Act 1, featuring a total of 5 main game chapters selected from both routes.\n\n\
  20,000+ words of story, comprising 1.5-2.5 hours of gameplay (2.5-4 hours if streaming)\n\
  \n3 scene illustrations/CGs\n\n15 soundtracks\n\nPartial Voice Acting, including\
  \ six fully voiced scenes.\n\n Of Sense and Soul   is a passion project by Forsythia\
  \ Productions, created by Ingrid Yiu and Rowan York.\n\n Lead Developer and Artist,\
  \ Co-writer: Ingrid Yiu ( ingthing )\n\n Lead Writer: Rowan York \n\n Background\
  \ Artists:  Joseph , Luciam , and Ebbasuke \n\n Programmers:  Ende , Justinn , and\
  \ Fen \n\n Composers:  Martin Johansson and Henri Tikkala , with jingles by Bell\
  \ Kalengar \n\n Casting Director:  Eamonn Leighton \n\n Voice Director: MAHO!Cody\
  \ \n\n Audio Engineer:  Xuan Vinh Huynh \n\n VOICE CAST \n\n Max Herzfeld as Hugo\
  \ Brooks Shaun Mendum as Seamus Charkham Olivia Vidas as Camilla Brooks Oliver \"\
  Liv\" Smith as James Ashburne\n Chidumebi Njoku-Browne as \nEverett Lewis Richard\
  \ Gibson as Mr. Coulston Nick Eriksen as Mr. Bentley Vinay P. Nariani as Mr. Hammond\
  \ Su Ling Chan as Miss Lee Mateo Ervin as Cornelius Steven Kelly as Mr. Evans Vikram\
  \ Rajan as Mr. Rahim \r\n\n Special thanks to our friends and fellow devs who have\
  \ helped provide feedback on OSAS! We couldn't have done it without you :) \n\n\
  Looking for more OSAS? \n\n Confluence is a free-to-play spin-off game we made for\
  \ O2A2 Queer Edition 2023! \n\nIt's a short, sweet, fully voiced snapshot of the\
  \ happy ending in store for Hugo in OSAS, so give it a go if you've got 10 minutes\
  \ to spare!\n\n Confluence (noun): a coming or flowing together, meeting, or gathering\
  \ at one point; the joining of two rivers.  In the epilogue of his happy ending,\
  \ Hugo waxes poetic on the scale of his life and love and how, wondrously, the littlest\
  \ of things can also be the most precious. \r\n\n Confluence: An Of Sense and Soul\
  \ Soliloquy by Forsythia Productions, ingthing \n\n Click on the arrow to the left\
  \ of each question to open the dropdown. \n\n I've found a bug/issue, what can I\
  \ do about it? \nFor visual glitches, try restarting the game first--but if all\
  \ else fails, we have a bugs and fixes thread on our Discord or you can fill out\
  \ our Demo Feedback form !\n\n When will the game be released? \nThere is no release\
  \ date determined as of yet. To find out as soon as we announce it,   Subscribe\
  \ to our newsletter !\n\n How will negative \"period-typical\" social attitudes\
  \ be handled in the story? \n Of Sense and Soul is written with the intention of\
  \ portraying queer individuals and voices in history in a positive, heartfelt way.\
  \ Although the setting is intended to be believably historic, our narrative does\
  \ not display or provide a platform for discrimination of marginalised peoples,\
  \ moralistic perspectives, or other prejudices of the time.  \n\n Will the game\
  \ be crowdfunded? \nThe game has already been funded through Kickstarter ! We couldn't\
  \ have done it without you :) \n\n Will there be voice acting? \nPartial voice acting\
  \ will feature in OSAS, consisting of vocalisations for regular gameplay and some\
  \ fully voiced scenes.\n\n How can I share my thoughts on the demo? \nVisit us over\
  \ on Discord or leave a comment/review on this page! We'd love to hear from you!\
  \ We also have an Extended Demo Feedback Form for more in-depth prompting."
