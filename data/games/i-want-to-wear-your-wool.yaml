description_full: "As spring arrives, Fable the wolf wants to turn over a new leaf\
  \ and make friends with the other animals in the glade. Along the way, they meet\
  \ a sheep who is a little too eager to be eaten.\n\n Please note only the web build\
  \ currently has audio. \n\n Rating  the game 5 stars means more people will see\
  \ it! ⭐\n\nFeatures\n\n1 complete story\n\n6000 words\n\n11 special illustrations\n\
