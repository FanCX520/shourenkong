description_full: "Wayfinder: A Modern Tale of Furry (v1.9.5) out Now!\n\n Patreon\
  \  $3 and $5 tiers get builds two weeks earlier!\n\n FVN.li  gets builds five days\
  \ early!\n\n1.9.5 Includes the an entire day (day 6) of story and ends Act 1 with\
  \ the first route split!\n\n Fynn is a mid-twenties college sophomore who arrives\
  \ home after a pretty crappy day.  As he goes about unwinding and studying as usual,\
  \ he meets the first of three wolf giants who will challenge his view on the world\
  \ around him— and introduce him to a world beyond his imagination.\n\n Fynn — a\
  \ ' finder '— soon finds himself at a crossroads between continuing to maintain\
  \ his \" regular-old mortal\"  life and breaking free from the monotonous cycle\
  \ to help the wolf giants of the Iron Wood find their way. There, in the world of\
  \ giants,  Jotunheim , Fynn and his new companions will face dark forces that threaten\
  \ the very threads of fate themselves.\n\nHowever, the world of man is not without\
  \ its own dark forces...\n\n Wayfinder is a gay, furry, modern fantasy visual novel\
  \ that takes place in a fictionalized city along the United States' eastern coast.\n\
  \nEnjoy the story so far? Leave a rating! It helps a lot!\n\n I've made a Discord\
  \ server! \nJoin us to chat about Wayfinder with other members!\n\n I have a Telegram\
  \   channel for Wayfinder! \n Check it out for any updates or my other projects!\
  \ \n\nWriting and Concepts by Lavan \n\n Bluesky :  @wayfinderlavan \n Twitter : \
  \ @ValiantValor \n\nCharacter Sprites and CGs by Tehngo \n Bluesky: @tehngo \n\n\
  Original Music by Camazule \n Bluesky :  @camazule \n\nFormer Sprites by Alv \n\
  Twitter: [Currently Private]\n\n(Older) Twitter :  @WayfinderVN\n\n (Older) Instagram\
  \ :  @WayfinderVN \n\n Wayfinder has partnered with Boys Love Universe!\n\nCheck\
  \ them out below:\n\n Boys Love Universe from All Ages of Geek \r\n\nCheck out other\
  \ Visual Novels I love~\n\n Heart of Amethyst by Jaden Black\n\n Distant Travels\
  \ by GruntSteel"
