description_full: "Play as Dev, a human new to the all saurian Cretaceous College\
  \ of Computing!He never thought he would actually be accepted into CCC when he applied\
  \ - much less be offered a full ride. From here on out, Dev's choices will impact\
  \ who he meets and his eventual fate in this whole new world - and the fates of\
  \ those around him, as well. \n\nInspired by Snoot Game and I Wani Hug That Gator,\
  \ DevLog is a bespoke visual novel aiming for a 2026 release. We are currently on\
  \ Alpha 0.4.3, encompassing the first four chapters of the game.\n\n Discord \n\n\
  \ Patreon \n\n X \n\nWe thank you all for your support! :)"
