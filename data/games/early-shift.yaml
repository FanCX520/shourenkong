description_full: "You moved down south here two months ago. Between lectures, the\
  \ long-ass drive to school, and the sweat-soaked summer, you don't expect much to\
  \ change... That is, until you meet Cooper, an alligator who works at the local\
  \ Shell. \n\nWhat starts as a simple stop for fuel could turn into something more...\n\
  \n Early Shift  is a furry visual novel set in a small-town in Florida.\n\nIt’s\
  \ in progress. There's no planned release schedule at the moment but you can check\
  \ my twitter (@noisybear) for updates. Your feedback and comments are super important\
  \ to me. The more I receive, the more motivation I'll have to update!\n\n Day one\
  \ play time:  30~ minutes\n\n If you'd like to support me and get early access to\
  \ new Early Shift content, feel free to join the PATREON over here ( PATREON ).\n\
  \n Note: This game is best played on Mac or PC. While you can download it for android,\
  \ it is untested so you may experience bugs or glitches in gameplay. If you experience\
  \ any other bugs, feel free to report them on the discord server ( https://discord.gg/fxbxFYWK9X\
  \ )"
