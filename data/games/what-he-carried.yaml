description_full: 'It''s a day ending with "Y", ergo, Toby is running late. There''s
  just so many things needing to be done and--oh shit, he''s fucked up again. He crashed
  into a burly wall of a bear! Mind helping that innocent bystander put their things
  back together?


  ---


  This is an incomplete demo at this time featuring mutually exclusive choices, a
  secret scene, and a dazzling custom GUI. If you enjoyed what you say, consider rating,
  leaving a comment, or even a tip through the downloads screen!


  What He Carried is around 6k words of SFW content created for the 2024 Novembear
  Game Jam .


