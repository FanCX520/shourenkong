description_full: "Master Thief Lupin the Third is always two steps ahead of his eternal\
  \ nemesis, the ICPO's Inspector Zenigata. But occasionally, Zenigata is lucky enough\
  \ to slap a pair of cuffs onto Lupin, and today is one of those days. On the train\
  \ ride over to the hoosegow, Lupin's time is dwindling, and it's time to cash in\
  \ on Zenigata's biggest weakness: his longstanding crush on his eternal rival. \n\
  \nThis short visual novel has:\n\nFour endings, \n\nA jazzy soundtrack,\n\nAnd all\
  \ the visuals are traditionally crafted with watercolor and fountain pen!\n\nPlease\
  \ enjoy and flirt your way to freedom!\n\nAnd if you'd prefer to flirt with Jigen?\
  \ Boss, we got you covered:\n\n <a href=\" The\" class=\"redactor-linkify-object\"\
  >https://alexisroyce.itch.io/the-jig-is-up\">The Jig is Up! by AlexisRoyce, Tsushi</a>"
