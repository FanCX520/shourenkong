description_full: "Help yourself to the city's valuables in Catburglar , a stealth\
  \ platformer inspired by Trilby: The Art of Theft. Play as Cynth, and use your wits\
  \ and agility to steal through a series of highrise apartments, outwitting guards\
  \ and security cameras as you make your way to your goal.\n\nControls\n\nUse the\
  \ arrow keys to move.\nUse X to interact.\n\nCredits\n\nDirected, written, and developed\
  \ by John Gabriel \nPixel art by Jerico Landry \nDigital art and character design\
  \ by Kyveri \nMusic by Sacha Feldman \nFeaturing Carrie Drovdlic as the voice of\
  \ Cynth\n\n Catburglar was made for the sixty-third Godot Wild Jam."
