description_full: "WARNING: SFW but mild suggestive content ahead, proceed with caution.\n\
  \nWelcome to Mech-o Café!\n\nDo you like big buff men? Do you like robots? Do you\
  \ like big buff robots but can't find any game that merges both?  Well, you're in\
  \ luck! \n\nIn a world where the creation of  Makrinos , a new kind of sentient\
  \ humanoid robots, redefined society, play as Corey and discover \" Mech-o Café\
  \ \", a macho café with quite an exceptional staff...\n\nMultiple routes!\n\nIn\
  \ this unusual café, you'll have the opportunity to learn more about the mechanoid\
  \ waiters as you choose who will attend to you at each significant turn of the story.\n\
  \nWill you spend time with the fancy Dapper ? The radiant Spark ? The enigmatic \
  \ Volko ? The clumsy Trip ? Or the quiet Zenn ? The choice is yours to make! Oh,\
  \ and there's the cook Gen too. You don't actually pick him, but he's a funny guy!\n\
  \n...And multiple endings!\n\nThere will be a total of 8 different endings in the\
  \ full game. Try to get them all! Though one of them might be harder to achieve...\
  \ haha! \n\nFunny OST!\n\n You can listen to the OST here: \n\n YouTube  (Batch\
  \ 1) -  Spotify  (FULL) -  SoundCloud  (FULL) - Bandcamp (EXTENDED)  (Batch 1)\n\
  \nHow is the development going?\n\nIn all honesty, the development is currently\
  \ going slow because of all the work I got for college. HOWEVER, it should be over\
  \ pretty soon and we’ll be able to continue working hard on the game!\n\nIf you\
  \ want, I post many updates and early footages of the game (screenshots, art, OST) on\
  \ the Twitter page of the project  here ! Don't hesitate to follow it if you're\
  \ curious.\n\nALSO, you can download the game on GameJolt here , if you’d rather\
  \ get it on another platform due to the current circumstances.\n\n \"this started\
  \ out as just brainrot but xans manifested a whole fucking game for it somehow\"\
  \ \n\n - BenceWusky"
