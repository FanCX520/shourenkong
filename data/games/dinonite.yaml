description_full: "DINO NITE IS NOT CURRENTLY IN DEVELOPMENT.\n\n Dino Nite  is a\
  \ short, early prototype visual novel concept involving inter-dimensional dinosaurs, \
  \ a museum of natural history and a lone security guard just trying to get through\
  \ the night shift. \n\n NOV UPDATE:  \n\nHeya I hope you all are well!\nIt was the\
  \ first Visual Novel I've ever taken a shot at creating.\nWe're a two party team\
  \ and made Dinonite as a way to prepare for a much larger project.\n\nI will come\
  \ back to this world of dinosaur dimensional jumping but it's going to take more\
  \ time.\n\nThank you so much for  reading.\n\nIn the meantime- Here's some concept\
  \ art!"
